name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check source encoding
        run: python verify_encoding.py

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: printf '%s' "${GITHUB_REF_NAME#v}" > version.txt

      - name: Build executable
        run: pyinstaller --noconfirm --clean Media-Downloader.spec

      - name: Check the built executable
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/Media-Downloader.exe" -ArgumentList "--selftest" -Wait -PassThru
          $report = Join-Path $env:LOCALAPPDATA "Media-Downloader/selftest.txt"
          if (Test-Path $report) { Get-Content $report -Encoding UTF8 }
          if ($proc.ExitCode -ne 0) { exit 1 }

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/Media-Downloader.exe" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/SHA256SUMS.txt", "$hash  Media-Downloader.exe`n")
          Get-Content "dist/SHA256SUMS.txt"

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/Media-Downloader.exe

      - name: Build release notes from CHANGELOG
        run: python release_notes.py --output release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Media-Downloader-exe
          path: |
            dist/Media-Downloader.exe
            dist/SHA256SUMS.txt

      # Черновик: публикация только вручную после проверки.
      # gh release edit vX.Y.Z --draft=false
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          make_latest: "false"
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            dist/Media-Downloader.exe
            dist/SHA256SUMS.txt

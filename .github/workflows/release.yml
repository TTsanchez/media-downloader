name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check source encoding
        run: python verify_encoding.py

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: printf '%s' "${GITHUB_REF_NAME#v}" > version.txt

      - name: Build executable
        run: pyinstaller --noconfirm --clean Media-Downloader.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Media-Downloader-exe
          path: dist/Media-Downloader.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Media-Downloader.exe
          generate_release_notes: true

name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check syntax
        run: python -m py_compile main.py downloader.py utils.py pot.py ffmpeg_tools.py prepare_ffmpeg.py diagnostics.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
